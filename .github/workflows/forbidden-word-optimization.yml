name: Forbidden-word function-speed study

on:
  push:
    paths:
      - "papers/forbidden-word-optimization-2026/**"
      - "unittests/papers/test_forbidden_word_optimization.py"
      - ".github/workflows/forbidden-word-optimization.yml"
  pull_request:
    paths:
      - "papers/forbidden-word-optimization-2026/**"
      - "unittests/papers/test_forbidden_word_optimization.py"
      - ".github/workflows/forbidden-word-optimization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          python -m pip install "torch>=2.6" "transformers>=4.57,<6"
          "peft>=0.18,<1" "scipy>=1.15,<2" "tqdm>=4.66,<5" "pytest>=7,<10"
      - run: python papers/forbidden-word-optimization-2026/run.py --help
      - run: python -m pytest -q unittests/papers/test_forbidden_word_optimization.py
        env:
          PYTHONPATH: .
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
