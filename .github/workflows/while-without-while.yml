name: While without while study

on:
  push:
    paths:
      - "papers/while-without-while-2026/**"
      - "unittests/papers/test_while_without_while.py"
      - ".github/workflows/while-without-while.yml"
  pull_request:
    paths:
      - "papers/while-without-while-2026/**"
      - "unittests/papers/test_while_without_while.py"
      - ".github/workflows/while-without-while.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "torch>=2.6" --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          python -m pip install "transformers>=5.2,<6"
          "peft>=0.18,<1" "tqdm>=4.66,<5" "pytest>=7,<10"
      - run: python papers/while-without-while-2026/run.py --help
      - run: python -m pytest -q unittests/papers/test_while_without_while.py
        env:
          PYTHONPATH: .
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
