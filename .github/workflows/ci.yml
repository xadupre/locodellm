name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ONNX light wheels
        run: >-
          python -m pip install
          https://github.com/xadupre/onnx-light/releases/download/0.2.6/onnx_light-0.2.6-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
          https://github.com/xadupre/onnx-light-cpu/releases/download/0.2.6/onnx_light_cpu-0.2.6-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pip freeze
        run: pip freeze
      - name: Run tests
        env:
          UNITTEST_GOING: "1"
        run: pytest --durations=10 --cov=locodellm --cov-report=xml --cov-report=html --cov-report=term-missing unittests
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}
          name: locodellm-${{ matrix.python-version }}
        continue-on-error: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov
        if: always()
